name: Terraform

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/terraform/**"
  push:
    branches: [main, develop]
    paths:
      - "infra/terraform/**"

env:
  TF_VERSION: "1.10.5"
  TFLINT_VERSION: "v0.60.0"
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint
        run: tflint --init && tflint

      - name: Terraform validate
        run: terraform validate

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yml

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [validate, checkov]
    if: vars.AWS_ROLE_ARN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure required secrets are present
        if: ${{ env.AWS_ROLE_ARN == '' }}
        run: |
          echo "Missing required variable: AWS_ROLE_ARN." >&2
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=envs/staging/backend.config

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=envs/staging/terraform.tfvars \
            -out=tfplan

      - name: Export plan text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan.txt
