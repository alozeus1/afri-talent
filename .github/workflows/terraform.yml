name: Terraform

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/terraform/**"
  push:
    branches: [main, develop]
    paths:
      - "infra/terraform/**"

env:
  TF_VERSION: "1.10.5"
  TFLINT_VERSION: "v0.60.0"
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Debug Terraform fmt inputs
        run: |
          pwd
          terraform -version
          ls -l locals.tf envs/staging
          sed -n '1,160p' locals.tf

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint
        run: tflint --init && tflint

      - name: Terraform validate
        run: terraform validate

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure required secrets are present
        if: ${{ env.AWS_ROLE_ARN == '' }}
        run: |
          echo "Missing required variable: AWS_ROLE_ARN." >&2
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=envs/staging/backend.config

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -var-file=envs/staging/terraform.tfvars \
            -out=tfplan
