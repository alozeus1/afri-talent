name: Terraform

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  TF_VERSION: "1.10.5"
  TFLINT_VERSION: "v0.60.0"
  AWS_REGION: us-east-1

jobs:
  changes:
    name: Detect Terraform Changes
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    outputs:
      infra_changed: ${{ steps.filter.outputs.infra }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect infra diffs
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/terraform/**'

  validate:
    name: Terraform Validate
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [changes]
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        if: needs.changes.outputs.infra_changed == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: No Terraform changes detected
        if: needs.changes.outputs.infra_changed != 'true'
        run: echo "No infra/terraform changes in this revision; Terraform validation check passes with no-op."

      - name: Terraform fmt
        if: needs.changes.outputs.infra_changed == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        if: needs.changes.outputs.infra_changed == 'true'
        run: terraform init -backend=false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        if: needs.changes.outputs.infra_changed == 'true'
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint
        if: needs.changes.outputs.infra_changed == 'true'
        run: tflint --init && tflint

      - name: Terraform validate
        if: needs.changes.outputs.infra_changed == 'true'
        run: terraform validate

  checkov:
    name: Checkov
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [changes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No Terraform changes detected
        if: needs.changes.outputs.infra_changed != 'true'
        run: echo "No infra/terraform changes in this revision; Checkov check passes with no-op."

      - name: Run Checkov
        if: needs.changes.outputs.infra_changed == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yml

  plan:
    name: Terraform Plan
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [changes, validate, checkov]
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra_changed == 'true' && vars.AWS_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure required secrets are present
        if: ${{ env.AWS_ROLE_ARN == '' }}
        run: |
          echo "Missing required variable: AWS_ROLE_ARN." >&2
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=envs/staging/backend.config

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=envs/staging/terraform.tfvars \
            -out=tfplan

      - name: Export plan text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan.txt

  # ---------------------------------------------------------------------------
  # New-account migration target: validate + plan against accounts/dev-new.
  # Runs on PRs only; uses the new-account OIDC role when configured.
  # ---------------------------------------------------------------------------
  validate-dev-new:
    name: Terraform Validate (dev-new)
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [changes]
    if: needs.changes.outputs.infra_changed == 'true'
    defaults:
      run:
        working-directory: infra/terraform/accounts/dev-new

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if dev-new not yet wired
        id: probe
        shell: bash
        run: |
          if [ ! -f main.tf ] && [ ! -f versions.tf ]; then
            echo "dev-new account stack not present; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.probe.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (recursive, repo-wide)
        if: steps.probe.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        if: steps.probe.outputs.present == 'true'
        run: terraform init -backend=false

      - name: Terraform validate
        if: steps.probe.outputs.present == 'true'
        run: terraform validate

  plan-dev-new:
    name: Terraform Plan (dev-new)
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [changes, validate-dev-new, checkov]
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra_changed == 'true' && vars.AWS_ACCOUNT_ID != '' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      OIDC_ROLE_NAME: ${{ vars.OIDC_ROLE_NAME || 'afritalent-dev-github-deploy' }}
    defaults:
      run:
        working-directory: infra/terraform/accounts/dev-new

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if dev-new not yet wired
        id: probe
        shell: bash
        run: |
          if [ ! -f main.tf ] && [ ! -f versions.tf ]; then
            echo "dev-new account stack not present; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.probe.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (new account, OIDC)
        if: steps.probe.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        if: steps.probe.outputs.present == 'true'
        env:
          TF_BACKEND_BUCKET: afritalent-${{ vars.AWS_ACCOUNT_ID }}-tfstate
          TF_BACKEND_LOCK_TABLE: afritalent-${{ vars.AWS_ACCOUNT_ID }}-tflocks
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="dynamodb_table=${TF_BACKEND_LOCK_TABLE}" \
            -backend-config="key=dev-new/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -input=false

      - name: Terraform plan (read-only)
        if: steps.probe.outputs.present == 'true'
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -lock=false \
            -out=tfplan-dev-new

      - name: Export plan text
        if: steps.probe.outputs.present == 'true'
        run: terraform show -no-color tfplan-dev-new > tfplan-dev-new.txt

      - name: Upload plan artifact
        if: steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev-new
          path: infra/terraform/accounts/dev-new/tfplan-dev-new.txt
