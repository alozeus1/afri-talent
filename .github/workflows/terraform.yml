name: Terraform

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  TF_VERSION: "1.10.5"
  TFLINT_VERSION: "v0.60.0"
  AWS_REGION: us-east-1

jobs:
  changes:
    name: Detect Terraform Changes
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    outputs:
      infra_changed: ${{ steps.filter.outputs.infra }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect infra diffs
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/terraform/**'

  validate:
    name: Terraform Validate
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [changes]
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        if: needs.changes.outputs.infra_changed == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: No Terraform changes detected
        if: needs.changes.outputs.infra_changed != 'true'
        run: echo "No infra/terraform changes in this revision; Terraform validation check passes with no-op."

      - name: Terraform fmt
        if: needs.changes.outputs.infra_changed == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        if: needs.changes.outputs.infra_changed == 'true'
        run: terraform init -backend=false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        if: needs.changes.outputs.infra_changed == 'true'
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint
        if: needs.changes.outputs.infra_changed == 'true'
        run: tflint --init && tflint

      - name: Terraform validate
        if: needs.changes.outputs.infra_changed == 'true'
        run: terraform validate

  checkov:
    name: Checkov
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [changes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No Terraform changes detected
        if: needs.changes.outputs.infra_changed != 'true'
        run: echo "No infra/terraform changes in this revision; Checkov check passes with no-op."

      - name: Run Checkov
        if: needs.changes.outputs.infra_changed == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yml

  plan:
    name: Terraform Plan
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [changes, validate, checkov]
    if: github.event_name == 'pull_request' && needs.changes.outputs.infra_changed == 'true' && vars.AWS_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure required secrets are present
        if: ${{ env.AWS_ROLE_ARN == '' }}
        run: |
          echo "Missing required variable: AWS_ROLE_ARN." >&2
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=envs/staging/backend.config

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -var-file=envs/staging/terraform.tfvars \
            -out=tfplan

      - name: Export plan text
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/terraform/tfplan.txt
