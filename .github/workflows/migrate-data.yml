name: Migrate Data (old RDS → new Aurora)

# One-off, manually-triggered workflow that runs `pg_dump | pg_restore` from the
# old account's RDS into the new account's Aurora cluster.
#
# Pre-conditions before running:
#   1. Old RDS made publicly_accessible=true (toggle from old-account console).
#   2. GitHub repo secret `OLD_DATABASE_URL` set to a full Postgres URL with
#      password, e.g.
#        postgresql://USER:PASS@old-rds-public-endpoint:5432/afritalent
#   3. New-account OIDC role `afritalent-dev-github-deploy` has perms (it has
#      AdministratorAccess from the bootstrap, which is sufficient).
#
# After running:
#   4. Toggle old RDS publicly_accessible=false again.
#   5. Optionally delete the GitHub secret OLD_DATABASE_URL.
#
# The migrator runs as a one-off Fargate task in the new VPC's private subnets.
# The task uses the public `postgres:16-alpine` image (pulled via NAT instance)
# and pipes pg_dump → pg_restore in a single shell. No dump file is staged in
# S3.

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Skip migration; print row counts on both sides."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  OIDC_ROLE_NAME: ${{ vars.OIDC_ROLE_NAME || 'afritalent-dev-github-deploy' }}
  CLUSTER_NAME: afritalent-dev-cluster
  BACKEND_SERVICE: afritalent-dev-backend
  SSM_DATABASE_URL_PARAM: /afritalent/dev/DATABASE_URL
  TASK_FAMILY: afritalent-dev-data-migrator

jobs:
  migrate:
    name: Run pg_dump | pg_restore
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}
        run: |
          if [ -z "${OLD_DATABASE_URL}" ]; then
            echo "::error::Missing required GitHub secret OLD_DATABASE_URL." >&2
            exit 1
          fi
          if [ -z "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "::error::Missing required GitHub variable AWS_ACCOUNT_ID." >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover network + IAM details from existing backend service
        id: net
        run: |
          set -euo pipefail
          NET_JSON=$(aws ecs describe-services \
            --cluster "${CLUSTER_NAME}" \
            --services "${BACKEND_SERVICE}" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)
          # Emit network config as a JSON file so we can pass it via file:// to
          # `aws ecs run-task --network-configuration` and avoid shorthand
          # quoting pitfalls with multi-subnet/sg arrays.
          jq -n --argjson nc "$NET_JSON" '{awsvpcConfiguration: {subnets: $nc.subnets, securityGroups: $nc.securityGroups, assignPublicIp: "DISABLED"}}' > netconf.json
          SUBNETS=$(echo "$NET_JSON" | jq -r '.subnets | join(",")')
          SECGROUPS=$(echo "$NET_JSON" | jq -r '.securityGroups | join(",")')

          BACKEND_TD=$(aws ecs describe-task-definition \
            --task-definition "${BACKEND_SERVICE}" \
            --query 'taskDefinition' --output json)
          EXEC_ROLE=$(echo "$BACKEND_TD" | jq -r '.executionRoleArn')
          TASK_ROLE=$(echo "$BACKEND_TD" | jq -r '.taskRoleArn')
          LOG_GROUP=$(echo "$BACKEND_TD" | jq -r '.containerDefinitions[0].logConfiguration.options."awslogs-group"')

          if [ -z "$SUBNETS" ] || [ -z "$SECGROUPS" ] || [ "$EXEC_ROLE" = "null" ]; then
            echo "::error::Failed to discover network/IAM details from ECS service ${BACKEND_SERVICE}." >&2
            exit 1
          fi

          echo "subnets=$SUBNETS" >> "$GITHUB_OUTPUT"
          echo "security_groups=$SECGROUPS" >> "$GITHUB_OUTPUT"
          echo "exec_role_arn=$EXEC_ROLE" >> "$GITHUB_OUTPUT"
          echo "task_role_arn=$TASK_ROLE" >> "$GITHUB_OUTPUT"
          echo "log_group=$LOG_GROUP" >> "$GITHUB_OUTPUT"

          echo "Discovered:"
          echo "  subnets=$SUBNETS"
          echo "  security_groups=$SECGROUPS"
          echo "  exec_role_arn=$EXEC_ROLE"
          echo "  task_role_arn=$TASK_ROLE"
          echo "  log_group=$LOG_GROUP"

      - name: Resolve new Aurora connection string from SSM
        id: dburl
        run: |
          set -euo pipefail
          NEW_URL=$(aws ssm get-parameter \
            --name "${SSM_DATABASE_URL_PARAM}" \
            --with-decryption \
            --query 'Parameter.Value' --output text)
          if [ -z "$NEW_URL" ] || [ "$NEW_URL" = "None" ]; then
            echo "::error::Could not read ${SSM_DATABASE_URL_PARAM} from SSM." >&2
            exit 1
          fi
          echo "::add-mask::$NEW_URL"
          {
            echo "url<<EOF"
            echo "$NEW_URL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build migration shell script
        id: script
        run: |
          set -euo pipefail
          # Single-quoted heredoc — no variable expansion in this block;
          # variables are resolved inside the migrator container at runtime.
          cat > migrate.sh <<'SCRIPT'
          #!/bin/sh
          set -eu
          if [ "${VERIFY_ONLY:-false}" = "true" ]; then
            echo "== Old DB counts =="
            for t in User Profile Job Company Application Subscription Resume Notification Message SavedSearch; do
              printf "  %-15s " "$t"
              psql "$OLD_DATABASE_URL" -tAX -c "SELECT count(*) FROM \"$t\";" 2>/dev/null || echo "(missing)"
            done
            echo "== New DB counts =="
            for t in User Profile Job Company Application Subscription Resume Notification Message SavedSearch; do
              printf "  %-15s " "$t"
              psql "$NEW_DATABASE_URL" -tAX -c "SELECT count(*) FROM \"$t\";" 2>/dev/null || echo "(missing)"
            done
            exit 0
          fi
          echo ">> dump+restore starting"
          pg_dump --format=custom --no-owner --no-acl --serializable-deferrable "$OLD_DATABASE_URL" \
            | pg_restore --no-owner --no-acl --clean --if-exists --exit-on-error --verbose -d "$NEW_DATABASE_URL"
          echo ">> dump+restore complete"
          SCRIPT
          chmod +x migrate.sh
          # Base64-encode so we can pass through ECS command argv without escaping.
          MIGRATE_B64=$(base64 -w0 migrate.sh)
          echo "::add-mask::$MIGRATE_B64"
          echo "b64=$MIGRATE_B64" >> "$GITHUB_OUTPUT"

      - name: Register one-off migrator task definition
        id: register
        env:
          EXEC_ROLE_ARN: ${{ steps.net.outputs.exec_role_arn }}
          TASK_ROLE_ARN: ${{ steps.net.outputs.task_role_arn }}
          LOG_GROUP: ${{ steps.net.outputs.log_group }}
          MIGRATE_B64: ${{ steps.script.outputs.b64 }}
        run: |
          set -euo pipefail
          # Build the task-definition JSON via jq to escape strings safely.
          jq -n \
            --arg family "$TASK_FAMILY" \
            --arg exec_role "$EXEC_ROLE_ARN" \
            --arg task_role "$TASK_ROLE_ARN" \
            --arg log_group "$LOG_GROUP" \
            --arg region "$AWS_REGION" \
            --arg cmd "echo \"\$MIGRATE_B64\" | base64 -d | sh" \
            '{
              family: $family,
              networkMode: "awsvpc",
              requiresCompatibilities: ["FARGATE"],
              cpu: "512",
              memory: "1024",
              executionRoleArn: $exec_role,
              taskRoleArn: $task_role,
              containerDefinitions: [{
                name: "migrator",
                image: "public.ecr.aws/docker/library/postgres:16-alpine",
                essential: true,
                command: ["sh", "-c", $cmd],
                logConfiguration: {
                  logDriver: "awslogs",
                  options: {
                    "awslogs-group": $log_group,
                    "awslogs-region": $region,
                    "awslogs-stream-prefix": "data-migrator"
                  }
                }
              }]
            }' > taskdef.json
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.json \
            --query 'taskDefinition.revision' --output text)
          rm -f taskdef.json
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Registered ${TASK_FAMILY}:${REVISION}"

      - name: Run migrator task
        id: run
        env:
          OLD_DATABASE_URL: ${{ secrets.OLD_DATABASE_URL }}
          NEW_DATABASE_URL: ${{ steps.dburl.outputs.url }}
          MIGRATE_B64: ${{ steps.script.outputs.b64 }}
          REVISION: ${{ steps.register.outputs.revision }}
          SUBNETS: ${{ steps.net.outputs.subnets }}
          SECURITY_GROUPS: ${{ steps.net.outputs.security_groups }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          jq -n \
            --arg old "$OLD_DATABASE_URL" \
            --arg new "$NEW_DATABASE_URL" \
            --arg b64 "$MIGRATE_B64" \
            --arg verify "$VERIFY_ONLY" \
            '{
              containerOverrides: [{
                name: "migrator",
                environment: [
                  {name: "OLD_DATABASE_URL", value: $old},
                  {name: "NEW_DATABASE_URL", value: $new},
                  {name: "MIGRATE_B64",      value: $b64},
                  {name: "VERIFY_ONLY",      value: $verify}
                ]
              }]
            }' > overrides.json
          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER_NAME}" \
            --task-definition "${TASK_FAMILY}:${REVISION}" \
            --launch-type FARGATE \
            --network-configuration file://netconf.json \
            --overrides file://overrides.json \
            --query 'tasks[0].taskArn' --output text)
          rm -f overrides.json
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::Failed to launch migrator task." >&2
            exit 1
          fi
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Launched task: $TASK_ARN"

      - name: Wait for task to stop
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
        run: |
          set -euo pipefail
          echo "Waiting for task to stop (up to 25 min)…"
          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${TASK_ARN}"
          echo "Task stopped."

      - name: Print task logs
        if: always()
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
          LOG_GROUP: ${{ steps.net.outputs.log_group }}
        run: |
          set -euo pipefail
          if [ -z "${TASK_ARN:-}" ]; then
            echo "(no task arn captured — skipping log fetch)"
            exit 0
          fi
          TASK_ID=$(echo "${TASK_ARN}" | awk -F'/' '{print $NF}')
          STREAM="data-migrator/migrator/${TASK_ID}"
          echo "Tailing log stream: ${LOG_GROUP} :: ${STREAM}"
          aws logs tail "${LOG_GROUP}" \
            --log-stream-names "${STREAM}" \
            --since 30m \
            --format short || echo "(log fetch failed; check CloudWatch directly)"

      - name: Check task exit status
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
        run: |
          set -euo pipefail
          DESC=$(aws ecs describe-tasks \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${TASK_ARN}" \
            --query 'tasks[0]' --output json)
          STATUS=$(echo "$DESC" | jq -r '.lastStatus')
          EXIT=$(echo "$DESC" | jq -r '.containers[0].exitCode // "null"')
          REASON=$(echo "$DESC" | jq -r '.stoppedReason // ""')
          echo "lastStatus=$STATUS"
          echo "containerExitCode=$EXIT"
          echo "stoppedReason=$REASON"
          if [ "$EXIT" != "0" ]; then
            echo "::error::Migrator task exited with code $EXIT (reason: $REASON)" >&2
            exit 1
          fi
          echo "Migration completed successfully."

      - name: Deregister one-off task definition
        if: always()
        env:
          REVISION: ${{ steps.register.outputs.revision }}
        run: |
          if [ -n "${REVISION:-}" ]; then
            aws ecs deregister-task-definition \
              --task-definition "${TASK_FAMILY}:${REVISION}" \
              --query 'taskDefinition.revision' --output text || true
          fi
