name: Restore Shared Snapshot + Migrate (old → new)

# Phase B of the cross-account RDS data migration.
#
# Phase A is done locally with old-account creds (snapshot already taken,
# copied with CMK, shared with new account 108188564905).
#
# This workflow:
#   1. Looks up the shared snapshot ARN by tag/identifier.
#   2. Restores it as a temporary RDS instance in the new VPC's isolated
#      subnets, in the same security group as ECS tasks (so Aurora migrator
#      can reach it on 5432).
#   3. Waits for the temp RDS to become available.
#   4. Constructs OLD_DATABASE_URL from the restored RDS endpoint + master
#      password supplied via secret.
#   5. Runs the same one-off Fargate migrator task pattern as
#      `migrate-data.yml` — `pg_dump | pg_restore --clean --if-exists` into
#      Aurora.
#   6. Tears down the temp RDS regardless of outcome (so it doesn't keep
#      billing).
#
# Inputs:
#   - shared_snapshot_arn   ARN of the snapshot shared from old account.
#                           e.g. arn:aws:rds:us-east-1:260820061731:snapshot:afritalent-staging-cmk-...
#   - source_master_password  GitHub secret OLD_DB_MASTER_PASSWORD must be set
#                           with the original DB master user password
#                           (preserved by the snapshot restore).
#   - verify_only           true → print row counts only, skip dump+restore.

on:
  workflow_dispatch:
    inputs:
      shared_snapshot_arn:
        description: "ARN of the shared snapshot (from old account)."
        required: true
      verify_only:
        description: "Skip migration; print row counts on both sides."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  OIDC_ROLE_NAME: ${{ vars.OIDC_ROLE_NAME || 'afritalent-dev-github-deploy' }}
  CLUSTER_NAME: afritalent-dev
  BACKEND_SERVICE: afritalent-dev-backend
  SSM_DATABASE_URL_PARAM: /afritalent/dev/DATABASE_URL
  TEMP_DB_INSTANCE_ID: afritalent-dev-migrator-source
  TEMP_DB_USER: afritalent
  TEMP_DB_NAME: afritalent
  TASK_FAMILY: afritalent-dev-data-migrator-snapshot

jobs:
  migrate:
    name: Restore + pg_dump + pg_restore + teardown
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        env:
          OLD_DB_MASTER_PASSWORD: ${{ secrets.OLD_DB_MASTER_PASSWORD }}
        run: |
          if [ -z "${OLD_DB_MASTER_PASSWORD}" ]; then
            echo "::error::Missing required GitHub secret OLD_DB_MASTER_PASSWORD." >&2
            exit 1
          fi
          if [ -z "${{ inputs.shared_snapshot_arn }}" ]; then
            echo "::error::shared_snapshot_arn input is required." >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover network + IAM details
        id: net
        run: |
          set -euo pipefail
          NET_JSON=$(aws ecs describe-services \
            --cluster "${CLUSTER_NAME}" \
            --services "${BACKEND_SERVICE}" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)
          jq -n --argjson nc "$NET_JSON" '{awsvpcConfiguration: {subnets: $nc.subnets, securityGroups: $nc.securityGroups, assignPublicIp: "DISABLED"}}' > netconf.json

          # Extract VPC ID from one of the subnets (used for the DB subnet group below).
          FIRST_SUBNET=$(echo "$NET_JSON" | jq -r '.subnets[0]')
          VPC_ID=$(aws ec2 describe-subnets --subnet-ids "$FIRST_SUBNET" --query 'Subnets[0].VpcId' --output text)
          # Use the same private subnets as ECS tasks for the temp RDS subnet group.
          SUBNET_LIST=$(echo "$NET_JSON" | jq -r '.subnets | join(",")')
          # Use the same SG as ECS tasks so the migrator can reach this RDS on 5432.
          SG_LIST=$(echo "$NET_JSON" | jq -r '.securityGroups | join(",")')

          BACKEND_TD=$(aws ecs describe-task-definition \
            --task-definition "${BACKEND_SERVICE}" \
            --query 'taskDefinition' --output json)
          EXEC_ROLE=$(echo "$BACKEND_TD" | jq -r '.executionRoleArn')
          TASK_ROLE=$(echo "$BACKEND_TD" | jq -r '.taskRoleArn')
          LOG_GROUP=$(echo "$BACKEND_TD" | jq -r '.containerDefinitions[0].logConfiguration.options."awslogs-group"')

          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "subnets=$SUBNET_LIST" >> "$GITHUB_OUTPUT"
          echo "security_groups=$SG_LIST" >> "$GITHUB_OUTPUT"
          echo "exec_role_arn=$EXEC_ROLE" >> "$GITHUB_OUTPUT"
          echo "task_role_arn=$TASK_ROLE" >> "$GITHUB_OUTPUT"
          echo "log_group=$LOG_GROUP" >> "$GITHUB_OUTPUT"

          echo "VPC=$VPC_ID"
          echo "Subnets=$SUBNET_LIST"
          echo "SecurityGroups=$SG_LIST"
          echo "ExecRole=$EXEC_ROLE"
          echo "TaskRole=$TASK_ROLE"
          echo "LogGroup=$LOG_GROUP"

      - name: Wait for shared snapshot to be visible + available
        env:
          SNAPSHOT_ARN: ${{ inputs.shared_snapshot_arn }}
        run: |
          set -euo pipefail
          echo "Waiting for snapshot $SNAPSHOT_ARN to be available…"
          aws rds wait db-snapshot-available \
            --db-snapshot-identifier "$SNAPSHOT_ARN"
          echo "Snapshot is available."

      - name: Create DB subnet group for temp RDS
        id: subnet_group
        run: |
          set -euo pipefail
          GROUP_NAME="afritalent-dev-migrator-subnet-grp"
          # Idempotent — create if missing.
          if ! aws rds describe-db-subnet-groups --db-subnet-group-name "$GROUP_NAME" >/dev/null 2>&1; then
            aws rds create-db-subnet-group \
              --db-subnet-group-name "$GROUP_NAME" \
              --db-subnet-group-description "Temporary subnet group for migration source RDS" \
              --subnet-ids ${{ steps.net.outputs.subnets }} \
              --tags Key=Purpose,Value=cross-account-migration
          fi
          echo "name=$GROUP_NAME" >> "$GITHUB_OUTPUT"

      - name: Restore temp RDS from shared snapshot
        env:
          SNAPSHOT_ARN: ${{ inputs.shared_snapshot_arn }}
          SUBNET_GROUP: ${{ steps.subnet_group.outputs.name }}
          SG_LIST: ${{ steps.net.outputs.security_groups }}
        run: |
          set -euo pipefail
          # Pre-flight: if previous run left a temp instance behind, delete it.
          if aws rds describe-db-instances --db-instance-identifier "${TEMP_DB_INSTANCE_ID}" >/dev/null 2>&1; then
            echo "Found existing ${TEMP_DB_INSTANCE_ID}; deleting before re-restore…"
            aws rds delete-db-instance --db-instance-identifier "${TEMP_DB_INSTANCE_ID}" --skip-final-snapshot --delete-automated-backups
            aws rds wait db-instance-deleted --db-instance-identifier "${TEMP_DB_INSTANCE_ID}"
          fi

          # Convert comma-separated SG list to JSON array for --vpc-security-group-ids
          IFS=',' read -ra SG_ARRAY <<< "$SG_LIST"

          echo "Restoring snapshot $SNAPSHOT_ARN as ${TEMP_DB_INSTANCE_ID}…"
          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier "${TEMP_DB_INSTANCE_ID}" \
            --db-snapshot-identifier "$SNAPSHOT_ARN" \
            --db-instance-class db.t4g.small \
            --no-publicly-accessible \
            --db-subnet-group-name "$SUBNET_GROUP" \
            --vpc-security-group-ids "${SG_ARRAY[@]}" \
            --no-multi-az \
            --no-auto-minor-version-upgrade \
            --copy-tags-to-snapshot \
            --tags Key=Purpose,Value=cross-account-migration Key=DeleteAfter,Value=2026-05-31 \
            --query 'DBInstance.{Status:DBInstanceStatus,Endpoint:Endpoint.Address}' --output json

          echo "Waiting for ${TEMP_DB_INSTANCE_ID} to be available (5–10 min)…"
          aws rds wait db-instance-available --db-instance-identifier "${TEMP_DB_INSTANCE_ID}"
          aws rds describe-db-instances --db-instance-identifier "${TEMP_DB_INSTANCE_ID}" \
            --query 'DBInstances[0].{Status:DBInstanceStatus,Endpoint:Endpoint.Address,Port:Endpoint.Port,Engine:Engine}' --output json

      - name: Resolve new Aurora connection string from SSM
        id: dburl
        run: |
          set -euo pipefail
          NEW_URL=$(aws ssm get-parameter \
            --name "${SSM_DATABASE_URL_PARAM}" \
            --with-decryption \
            --query 'Parameter.Value' --output text)
          if [ -z "$NEW_URL" ] || [ "$NEW_URL" = "None" ]; then
            echo "::error::Could not read ${SSM_DATABASE_URL_PARAM} from SSM." >&2
            exit 1
          fi
          echo "::add-mask::$NEW_URL"
          {
            echo "url<<EOF"
            echo "$NEW_URL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build OLD_DATABASE_URL from restored temp RDS
        id: olddb
        env:
          OLD_DB_MASTER_PASSWORD: ${{ secrets.OLD_DB_MASTER_PASSWORD }}
        run: |
          set -euo pipefail
          ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier "${TEMP_DB_INSTANCE_ID}" \
            --query 'DBInstances[0].Endpoint.Address' --output text)
          if [ -z "$ENDPOINT" ] || [ "$ENDPOINT" = "None" ]; then
            echo "::error::Failed to discover endpoint of ${TEMP_DB_INSTANCE_ID}." >&2
            exit 1
          fi
          # URL-encode just in case of special chars in password.
          OLD_DB_URL="postgresql://${TEMP_DB_USER}:${OLD_DB_MASTER_PASSWORD}@${ENDPOINT}:5432/${TEMP_DB_NAME}"
          echo "::add-mask::$OLD_DB_URL"
          {
            echo "url<<EOF"
            echo "$OLD_DB_URL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build migration shell script
        id: script
        run: |
          set -euo pipefail
          cat > migrate.sh <<'SCRIPT'
          #!/bin/sh
          set -eu
          if [ "${VERIFY_ONLY:-false}" = "true" ]; then
            echo "== Old DB counts =="
            for t in User Profile Job Company Application Subscription Resume Notification Message SavedSearch; do
              printf "  %-15s " "$t"
              psql "$OLD_DATABASE_URL" -tAX -c "SELECT count(*) FROM \"$t\";" 2>/dev/null || echo "(missing)"
            done
            echo "== New DB counts =="
            for t in User Profile Job Company Application Subscription Resume Notification Message SavedSearch; do
              printf "  %-15s " "$t"
              psql "$NEW_DATABASE_URL" -tAX -c "SELECT count(*) FROM \"$t\";" 2>/dev/null || echo "(missing)"
            done
            exit 0
          fi
          echo ">> dump+restore starting"
          pg_dump --format=custom --no-owner --no-acl --serializable-deferrable "$OLD_DATABASE_URL" \
            | pg_restore --no-owner --no-acl --clean --if-exists --exit-on-error --verbose -d "$NEW_DATABASE_URL"
          echo ">> dump+restore complete"
          SCRIPT
          chmod +x migrate.sh
          MIGRATE_B64=$(base64 -w0 migrate.sh)
          echo "::add-mask::$MIGRATE_B64"
          echo "b64=$MIGRATE_B64" >> "$GITHUB_OUTPUT"

      - name: Register one-off migrator task definition
        id: register
        env:
          EXEC_ROLE_ARN: ${{ steps.net.outputs.exec_role_arn }}
          TASK_ROLE_ARN: ${{ steps.net.outputs.task_role_arn }}
          LOG_GROUP: ${{ steps.net.outputs.log_group }}
        run: |
          set -euo pipefail
          jq -n \
            --arg family "$TASK_FAMILY" \
            --arg exec_role "$EXEC_ROLE_ARN" \
            --arg task_role "$TASK_ROLE_ARN" \
            --arg log_group "$LOG_GROUP" \
            --arg region "$AWS_REGION" \
            --arg cmd "echo \"\$MIGRATE_B64\" | base64 -d | sh" \
            '{
              family: $family,
              networkMode: "awsvpc",
              requiresCompatibilities: ["FARGATE"],
              cpu: "1024",
              memory: "2048",
              executionRoleArn: $exec_role,
              taskRoleArn: $task_role,
              containerDefinitions: [{
                name: "migrator",
                image: "public.ecr.aws/docker/library/postgres:16-alpine",
                essential: true,
                command: ["sh", "-c", $cmd],
                logConfiguration: {
                  logDriver: "awslogs",
                  options: {
                    "awslogs-group": $log_group,
                    "awslogs-region": $region,
                    "awslogs-stream-prefix": "data-migrator-snap"
                  }
                }
              }]
            }' > taskdef.json
          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef.json \
            --query 'taskDefinition.revision' --output text)
          rm -f taskdef.json
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Registered ${TASK_FAMILY}:${REVISION}"

      - name: Run migrator task
        id: run
        env:
          OLD_URL: ${{ steps.olddb.outputs.url }}
          NEW_URL: ${{ steps.dburl.outputs.url }}
          MIGRATE_B64: ${{ steps.script.outputs.b64 }}
          REVISION: ${{ steps.register.outputs.revision }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          set -euo pipefail
          jq -n \
            --arg old "$OLD_URL" \
            --arg new "$NEW_URL" \
            --arg b64 "$MIGRATE_B64" \
            --arg verify "$VERIFY_ONLY" \
            '{
              containerOverrides: [{
                name: "migrator",
                environment: [
                  {name: "OLD_DATABASE_URL", value: $old},
                  {name: "NEW_DATABASE_URL", value: $new},
                  {name: "MIGRATE_B64",      value: $b64},
                  {name: "VERIFY_ONLY",      value: $verify}
                ]
              }]
            }' > overrides.json
          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER_NAME}" \
            --task-definition "${TASK_FAMILY}:${REVISION}" \
            --launch-type FARGATE \
            --network-configuration file://netconf.json \
            --overrides file://overrides.json \
            --query 'tasks[0].taskArn' --output text)
          rm -f overrides.json
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Launched task: $TASK_ARN"

      - name: Wait for migrator to stop
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
        run: |
          set -euo pipefail
          aws ecs wait tasks-stopped \
            --cluster "${CLUSTER_NAME}" \
            --tasks "${TASK_ARN}"

      - name: Print migrator logs
        if: always()
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
          LOG_GROUP: ${{ steps.net.outputs.log_group }}
        run: |
          set -euo pipefail
          if [ -z "${TASK_ARN:-}" ]; then exit 0; fi
          TASK_ID=$(echo "${TASK_ARN}" | awk -F'/' '{print $NF}')
          STREAM="data-migrator-snap/migrator/${TASK_ID}"
          aws logs tail "${LOG_GROUP}" --log-stream-names "${STREAM}" --since 60m --format short || true

      - name: Check migrator exit
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
        run: |
          set -euo pipefail
          DESC=$(aws ecs describe-tasks \
            --cluster "${CLUSTER_NAME}" --tasks "${TASK_ARN}" \
            --query 'tasks[0]' --output json)
          EXIT=$(echo "$DESC" | jq -r '.containers[0].exitCode // "null"')
          REASON=$(echo "$DESC" | jq -r '.stoppedReason // ""')
          echo "exit=$EXIT reason=$REASON"
          if [ "$EXIT" != "0" ]; then
            echo "::error::Migrator exit $EXIT — $REASON" >&2
            exit 1
          fi

      - name: Teardown temp RDS (always)
        if: always()
        run: |
          set -euo pipefail
          if aws rds describe-db-instances --db-instance-identifier "${TEMP_DB_INSTANCE_ID}" >/dev/null 2>&1; then
            echo "Deleting ${TEMP_DB_INSTANCE_ID}…"
            aws rds delete-db-instance \
              --db-instance-identifier "${TEMP_DB_INSTANCE_ID}" \
              --skip-final-snapshot \
              --delete-automated-backups \
              --query 'DBInstance.DBInstanceStatus' --output text || true
          else
            echo "Temp RDS already gone."
          fi

      - name: Deregister task definition
        if: always()
        env:
          REVISION: ${{ steps.register.outputs.revision }}
        run: |
          if [ -n "${REVISION:-}" ]; then
            aws ecs deregister-task-definition \
              --task-definition "${TASK_FAMILY}:${REVISION}" \
              --query 'taskDefinition.revision' --output text || true
          fi
