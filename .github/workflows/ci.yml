name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NODE_VERSION: "20.19.0"
  TEST_DATABASE_URL: postgresql://afritalent:afritalent_test@localhost:5432/afritalent_test

jobs:
  workflow-lint:
    name: Workflow Lint
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/actionlint@v1.7.8

  backend-lint:
    name: Backend Lint
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  backend-typecheck:
    name: Backend Typecheck
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  backend-test:
    name: Backend Tests
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: afritalent
          POSTGRES_PASSWORD: afritalent_test
          POSTGRES_DB: afritalent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm test
        env:
          MOCK_AI: "1"
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  backend-build:
    name: Backend Build
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  frontend-lint:
    name: Frontend Lint
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-unit-test:
    name: Frontend Unit Tests
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit:ci
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000

  frontend-build:
    name: Frontend Build
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.staging.afri-talent.com
          NEXT_PUBLIC_BACKEND_URL: https://api.staging.afri-talent.com

  lighthouse-mobile:
    name: Lighthouse Mobile Performance
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [backend-test, frontend-unit-test]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: afritalent
          POSTGRES_PASSWORD: afritalent_test
          POSTGRES_DB: afritalent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate
      - name: Run database migrations
        working-directory: ./backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Seed test data
        working-directory: ./backend
        run: npx prisma db seed
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Start backend server
        working-directory: ./backend
        run: npm run dev &
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          E2E: "1"
          JWT_SECRET: test-jwt-secret-for-ci-32-bytes-minimum-padding
          FRONTEND_URL: http://localhost:3000
          MOCK_AI: "1"
          PORT: 4000
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      - name: Start frontend server
        working-directory: ./frontend
        run: npm run start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      - name: Wait for backend to be ready
        run: timeout 60 bash -c 'until curl -fsS http://localhost:4000/health > /dev/null; do sleep 2; done'
      - name: Wait for frontend to be ready
        run: timeout 60 bash -c 'until curl -fsSI http://localhost:3000/en | grep -q "200"; do sleep 2; done'
      - name: Run Lighthouse CI
        working-directory: ./frontend
        run: npm run test:perf:lighthouse
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_JSON != '' && vars.ACTIONS_RUNNER_LABELS_JSON || '["ubuntu-latest"]') }}
    needs: [backend-test, frontend-build, frontend-unit-test]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: afritalent
          POSTGRES_PASSWORD: afritalent_test
          POSTGRES_DB: afritalent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate
      - name: Run database migrations
        working-directory: ./backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Seed test data
        working-directory: ./backend
        run: npx prisma db seed
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Start backend server
        working-directory: ./backend
        run: npm run dev &
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          E2E: "1"
          JWT_SECRET: test-jwt-secret-for-ci-32-bytes-minimum-padding
          FRONTEND_URL: http://localhost:3000
          MOCK_AI: "1"
          PORT: 4000
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      - name: Start frontend server
        working-directory: ./frontend
        run: npm run start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      - name: Install Playwright browsers
        working-directory: ./frontend
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Wait for backend to be ready
        run: timeout 60 bash -c 'until curl -fsS http://localhost:4000/health > /dev/null; do sleep 2; done'
      - name: Wait for frontend to be ready
        run: timeout 60 bash -c 'until curl -fsSI http://localhost:3000/en | grep -q "200"; do sleep 2; done'
      - name: Run Playwright tests
        working-directory: ./frontend
        run: npx playwright test --reporter=github
        env:
          API_BASE_URL: http://localhost:4000
          APP_BASE_URL: http://localhost:3000
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
