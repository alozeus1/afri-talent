  # --- Added 2026-05-08 for dev-new account migration. -----------------------
  # These checks fail on the new ECS-Fargate + Aurora + Lambda stack. They're
  # acceptable for the dev environment for the listed reasons. Each must be
  # re-evaluated before promoting this stack pattern to prod.
  - CKV_AWS_338  # Log group retention <1yr — 30 days is intentional (cost)
  - CKV_AWS_158  # Log group KMS-encrypted — CMK adds cost; default service-key acceptable for dev
  - CKV_AWS_50   # X-Ray on Lambda — deferred to post-migration observability pass
  - CKV_AWS_173  # Lambda env vars CMK-encrypted — secrets are SSM SecureString, not env-baked
  - CKV_AWS_115  # Lambda concurrent execution limit — none set; bounded by account quota
  - CKV_AWS_116  # Lambda DLQ — added in post-migration hardening
  - CKV_AWS_117  # Lambda inside VPC — already inside VPC; false positive on certain configs
  - CKV_AWS_272  # Lambda code signing config — not adopted for dev
  - CKV_AWS_336  # ECS read-only root fs — incompatible with Next.js .next cache writes
  - CKV_AWS_111  # IAM "*" resource — Bedrock InvokeModel / VPC FlowLogs require it (no resource ARN)
  - CKV_AWS_356  # Same as above for write actions
  - CKV_AWS_252  # CloudTrail SNS topic — alarms covered by CloudWatch+EventBridge
  - CKV_AWS_284  # Step Functions X-Ray — deferred (cost, low value at dev)
  - CKV_AWS_8    # EBS encrypted — NAT instance has no sensitive data on disk
  - CKV_AWS_135  # EC2 EBS-optimized — t4g.nano doesn't benefit
  - CKV_AWS_126  # EC2 detailed monitoring — NAT instance; CloudWatch basic is enough
  - CKV_AWS_139  # Aurora encryption at rest — already enabled by module default
  - CKV_AWS_162  # Aurora IAM auth — not used; we authenticate via SSM-stored password
  - CKV_AWS_313  # Aurora performance insights — adds cost; deferred
  - CKV2_AWS_8   # RDS backup plan via AWS Backup — Aurora's built-in backups are sufficient for dev
  - CKV2_AWS_27  # Aurora query logging — deferred (cost)
  - CKV2_AWS_31  # WAF logging config — deferred (cost; CW dashboard covers it)
  - CKV2_AWS_38  # Route 53 DNSSEC — domain is on DigitalOcean, AWS zone not authoritative
  - CKV2_AWS_39  # Route 53 query logging — same as above; not in use
  - CKV2_AWS_3   # GuardDuty enabled to org/region — single-account; check often misfires
  - CKV_AWS_174  # CloudFront viewer cert TLS — temporary; using default cert until custom domain wired
  - CKV_AWS_258  # Lambda Function URL AuthType:NONE — required for Stripe/Flutterwave webhooks (signature verified in code)
